</style></head><body><div id="app"></div><script>'use strict';
const STORAGE_KEY='psychology_prosto_group_payments_v1';
const RUB=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const DATE=new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
const MONTH=new Intl.DateTimeFormat('ru-RU',{month:'short',year:'numeric'});
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>`${RUB.format(Number(n)||0)} ₽`;
const shortMoney=n=>RUB.format(Number(n)||0);
const round=n=>Math.round((Number(n)||0)*100)/100;
const id=()=>globalThis.crypto?.randomUUID?.()??('i'+Date.now().toString(36)+Math.random().toString(36).slice(2,9));
const nowIso=()=>new Date().toISOString();
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const isoDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseDate=s=>{const [y,m,d]=String(s||today()).split('-').map(Number);return new Date(y,m-1,d||1)};
const plusDays=(s,k)=>{const d=parseDate(s);d.setDate(d.getDate()+k);return isoDate(d)};
const plusMonths=(s,k)=>{const d=parseDate(s);return isoDate(new Date(d.getFullYear(),d.getMonth()+k,1))};
const monthStart=s=>String(s||today()).slice(0,7)+'-01';
const monthEnd=s=>{const d=parseDate(s);return isoDate(new Date(d.getFullYear(),d.getMonth()+1,0))};
const formatDate=s=>s?DATE.format(parseDate(s)):'—';
const formatMonth=s=>s?MONTH.format(parseDate(s)).replace(' г.',''):'—';
const daysBetween=(a,b)=>Math.round((parseDate(b)-parseDate(a))/86400000);
const option=(value,text,selected=false)=>`<option value="${esc(value)}" ${selected?'selected':''}>${esc(text)}</option>`;
const field=(label,html)=>`<label class="input-group"><span class="label">${esc(label)}</span>${html}</label>`;
const input=(name,value='',type='text',extra='')=>`<input class="field" name="${esc(name)}" type="${type}" value="${esc(value)}" ${extra}>`;
const select=(name,opts,value='',extra='')=>`<select class="field" name="${esc(name)}" ${extra}>${opts.map(o=>option(o[0],o[1],String(o[0])===String(value))).join('')}</select>`;
const methodNames={card:'Банковская карта',bank:'Перевод',cash:'Наличные',other:'Другое'};
const planNames={monthly:'Помесячно',block:'Блок целиком',full:'Вся программа',installments:'Индивидуальная рассрочка'};
const statusNames={active:'Активен',pause:'Пауза',completed:'Завершил',left:'Выбыл'};
const pages={overview:['Обзор','Общая картина и контрольные даты','◫'],groups:['Группы','Участники, периоды и оплаты','▦'],clients:['Клиенты','Карточки участников и история','♧'],payments:['Платежи','Денежные операции без дублирования','₽'],reports:['Отчёты','Поступления, задолженность и выгрузки','▥']};
function createGroup(name,leader,start,blocksSizes,price){let at=0;return {id:id(),name,leader,startDate:start,blocks:blocksSizes.map((count,i)=>({id:id(),name:`Блок ${i+1}`,periods:Array.from({length:count},(_,j)=>{const ms=plusMonths(start,at++);return{id:id(),label:`Месяц ${at}`,start:ms,end:monthEnd(ms),due:plusDays(ms,4),price}})}))};}
const periods=g=>(g?.blocks||[]).flatMap(b=>b.periods.map(p=>({...p,blockId:b.id,blockName:b.name})));
const findGroup=gId=>db.groups.find(g=>g.id===gId);
const findClient=cId=>db.clients.find(c=>c.id===cId);
const findEnrollment=eId=>db.enrollments.find(e=>e.id===eId);
const enrollmentGroup=e=>findGroup(e.groupId);
const enrollmentClient=e=>findClient(e.clientId);
function createEnrollment(cId,gId,plan='monthly',joined='',amounts=null){const g=findGroup(gId);const actualJoined=joined||g.startDate;return{id:id(),clientId:cId,groupId:gId,joined:actualJoined,plan,status:'active',amounts:amounts||{},dueDates:{},dueHistory:[],notes:'',scheduleNotes:''};}
const target=(e,p)=>Math.max(0,round((e.amounts||{})[p.id]??(p.end<monthStart(e.joined)?0:p.price)));
const dueDate=(e,p)=>e.dueDates?.[p.id]||p.due;
const targetTotal=e=>round(periods(enrollmentGroup(e)).reduce((s,p)=>s+target(e,p),0));
function allocations(eId,asof=null,excludeId=null){const a={};for(const p of db.payments){if(p.voided||p.enrollmentId!==eId||p.id===excludeId||(asof&&p.date>asof))continue;const sign=p.kind==='refund'?-1:1;for(const v of (p.allocations||[]))a[v.periodId]=round((a[v.periodId]||0)+sign*Number(v.amount||0));}return a;}
function received(eId,asof=null,excludeId=null){return round(db.payments.filter(p=>!p.voided&&p.enrollmentId===eId&&p.id!==excludeId&&(!asof||p.date<=asof)).reduce((s,p)=>s+(p.kind==='refund'?-1:1)*p.amount,0));}
function paidOnPeriod(e,p,asof=null){return round(allocations(e.id,asof)[p.id]||0)};
function credit(e,asof=null){return round(received(e.id,asof)-Object.values(allocations(e.id,asof)).reduce((a,b)=>a+b,0))};
function outstanding(e,asof=null){return Math.max(0,round(targetTotal(e)-received(e.id,asof)))};
function lateAmount(e,asof=today()){const a=allocations(e.id,asof);return round(periods(enrollmentGroup(e)).reduce((s,p)=>s+(dueDate(e,p)<asof?Math.max(0,round(target(e,p)-(a[p.id]||0))):0),0))};
function nextDue(e,asof=today()){const a=allocations(e.id,asof);const ps=periods(enrollmentGroup(e)).filter(p=>target(e,p)-(a[p.id]||0)>0.009).sort((p,q)=>dueDate(e,p).localeCompare(dueDate(e,q)));return ps[0]||null};
function periodState(e,p,asof=today()){const t=target(e,p);const paid=paidOnPeriod(e,p,asof),rest=Math.max(0,round(t-paid));if(!t)return{key:'neutral',label:'Не требуется',paid,rest};if(rest<=.009)return{key:'paid',label:'Оплачено',paid,rest:0};const days=daysBetween(asof,dueDate(e,p));if(days<0)return{key:'overdue',label:`Просрочено ${-days} дн.`,paid,rest};if(days<=3)return{key:'soon',label:days===0?'Оплатить сегодня':`Через ${days} дн.`,paid,rest};return{key:paid>0?'partial':'future',label:paid>0?'Частично':'Ожидается',paid,rest};}
function autoAllocate(e,amount,mode='payment',excludeId=null){const ps=periods(enrollmentGroup(e));const current=allocations(e.id,null,excludeId);const order=mode==='refund'?[...ps].reverse():ps;const existingCredit=Math.max(0,round(received(e.id,null,excludeId)-Object.values(current).reduce((s,v)=>s+v,0)));let left=round(amount-(mode==='refund'?Math.min(amount,existingCredit):0)),out={};for(const p of order){const t=target(e,p),paid=current[p.id]||0;const available=mode==='refund'?Math.max(0,paid):Math.max(0,t-paid);const val=Math.min(left,round(available));if(val>.009){out[p.id]=round(val);left=round(left-val)}if(left<=.009)break;}return{a:out,unallocated:round(amount-Object.values(out).reduce((s,v)=>s+v,0))};}
function demoData(){const start=plusMonths(monthStart(today()),-2),g=createGroup('Группа Сенаторова','Ольга Сенаторова',start,[4],7000);const gp=periods(g);gp[2].due=plusDays(today(),3);const second=createGroup('Группа Леликова','Юлия Леликова',plusMonths(monthStart(today()),-1),[3,3],8500);const b={version:1,groups:[g,second],clients:[],enrollments:[],payments:[],audit:[],settings:{lastBackupAt:null,demo:true},updatedAt:nowIso(),createdAt:nowIso()};function person(name,group,plan='monthly',amounts=null){const c={id:id(),name,email:'',phone:'',telegram:'',comment:''};b.clients.push(c);const e={id:id(),clientId:c.id,groupId:group.id,joined:group.startDate,plan,status:'active',amounts:amounts||{},dueDates:{},dueHistory:[],notes:'',scheduleNotes:''};b.enrollments.push(e);return e}function pay(e,amount,date,alloc,kind='payment',comment=''){b.payments.push({id:id(),enrollmentId:e.id,kind,amount,date,method:'bank',allocations:alloc,comment,createdAt:nowIso(),audit:[],voided:false})}const e1=person('Смирнова Марина Викторовна',g);pay(e1,7000,plusDays(gp[0].start,3),[{periodId:gp[0].id,amount:7000}]);pay(e1,7000,plusDays(gp[1].start,3),[{periodId:gp[1].id,amount:7000}]);
const discounted=Object.fromEntries(gp.map(p=>[p.id,6500]));const e2=person('Крылова Светлана Николаевна',g,'full',discounted);pay(e2,26000,plusDays(gp[0].start,8),gp.map(p=>({periodId:p.id,amount:6500})),'payment','Единая оплата со скидкой 2 000 ₽');
const e3=person('Белова Ольга Игоревна',g);pay(e3,3500,plusDays(gp[0].start,2),[{periodId:gp[0].id,amount:3500}]);
const e4=person('Титова Ирина Павловна',g);pay(e4,14000,plusDays(gp[0].start,2),gp.slice(0,2).map(p=>({periodId:p.id,amount:7000})));
const e5=person('Морозова Екатерина Сергеевна',g);pay(e5,21000,plusDays(gp[1].start,8),gp.slice(0,3).map(p=>({periodId:p.id,amount:7000})),'payment','Предоплата за три месяца');
const e6=person('Орлова Анастасия Павловна',g,'installments');e6.dueDates[gp[2].id]=today();pay(e6,7000,plusDays(gp[0].start,1),[{periodId:gp[0].id,amount:7000}]);
const sp=periods(second);const e7=person('Киселёва Ольга Ильинична',second);pay(e7,17000,plusDays(sp[0].start,5),sp.slice(0,2).map(p=>({periodId:p.id,amount:8500})));pay(e7,1000,plusDays(today(),-3),[{periodId:sp[1].id,amount:1000}],'refund','Частичный возврат по заявлению');
const e8=person('Волкова Дарья Андреевна',second,'monthly');pay(e8,8500,plusDays(sp[0].start,5),[{periodId:sp[0].id,amount:8500}]);
return b;}
function store(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));storageOk=true;return true}catch(err){storageOk=false;return false}}
function load(){try{const v=localStorage.getItem(STORAGE_KEY);if(v){const parsed=JSON.parse(v);if(parsed&&Array.isArray(parsed.groups)&&Array.isArray(parsed.payments)){return parsed}}}catch(e){}return demoData()}

function change(mut,msg='Изменения сохранены'){mut();db.updatedAt=nowIso();store();render();if(msg)toast(msg)}
let toastTimer=null;function toast(msg){const old=$('.toast');if(old)old.remove();const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),3700)}
function audit(action,target,description){db.audit.push({id:id(),at:nowIso(),action,target,description})}
function statusSpan(key,label){return `<span class="status ${esc(key)}">${esc(label)}</span>`}
function labelForPeriod(p){return `${p.label} · ${formatMonth(p.start)}`};
function groupOptions(selected,includeAll=false){return (includeAll?[['all','Все группы']]:[]).concat(db.groups.map(g=>[g.id,g.name]));}

function render(){const active=document.activeElement,focusName=active?.id||null;document.getElementById('app').innerHTML=shell();if(focusName){const el=document.getElementById(focusName);if(el&&ui.modal===null){el.focus()}}}
function renderView(){switch(ui.page){case'overview':return viewOverview();case'groups':return viewGroups();case'clients':return viewClients();case'payments':return viewPayments();case'reports':return viewReports();default:return''}}
function metricsOf(asof=today(),ens=db.enrollments){return {due:round(ens.reduce((s,e)=>s+targetTotal(e),0)),received:round(ens.reduce((s,e)=>s+received(e.id,asof),0)),late:round(ens.reduce((s,e)=>s+lateAmount(e,asof),0)),future:round(ens.reduce((s,e)=>s+periods(enrollmentGroup(e)).reduce((q,p)=>q+(dueDate(e,p)>asof?Math.max(0,target(e,p)-(allocations(e.id,asof)[p.id]||0)):0),0),0)),full:ens.filter(e=>outstanding(e,asof)<.009).length,persons:ens.length}}
function metric(label,value,detail='',kind=''){return `<div class="card metric ${kind}"><div class="small">${esc(label)}</div><div class="value">${esc(value)}</div><div class="detail">${esc(detail)}</div></div>`}
function controlList(type){const t=today();let items=[];for(const e of db.enrollments){for(const p of periods(enrollmentGroup(e))){const t0=target(e,p);if(!t0)continue;const st=periodState(e,p,t);if(st.rest<=.009)continue;const diff=daysBetween(t,dueDate(e,p));if((type==='overdue'&&diff<0)||(type==='today'&&diff===0)||(type==='week'&&diff>0&&diff<=7))items.push({e,p,st,diff});}}items.sort((a,b)=>a.diff-b.diff);return items;}
function controlListMarkup(type){let v=controlList(type);return !v.length?`<div class="empty" style="padding:22px 0"><strong>Нет платежей</strong><span>По выбранному условию всё спокойно</span></div>`:v.slice(0,6).map(x=>`<div class="listrow"><div><button class="linkbutton" data-act="clientCard" data-id="${x.e.clientId}">${esc(enrollmentClient(x.e)?.name)}</button><div class="meta">${esc(enrollmentGroup(x.e)?.name)} · ${esc(labelForPeriod(x.p))}<br>${formatDate(dueDate(x.e,x.p))} ${x.diff<0?'· '+(-x.diff)+' дн. просрочки':''}</div></div><div class="amount"><div class="${type==='overdue'?'text-red':''}">${money(x.st.rest)}</div><button class="togglebutton" data-act="newPayment" data-eid="${x.e.id}" data-pid="${x.p.id}">Внести ↗</button></div></div>`).join('')+(v.length>6?`<div class="small" style="margin-top:9px">Ещё записей: ${v.length-6}</div>`:'')}
function viewOverview(){const m=metricsOf();const groups=db.groups.map(g=>{const ee=db.enrollments.filter(e=>e.groupId===g.id),paid=round(ee.reduce((s,e)=>s+received(e.id),0)),targetSum=round(ee.reduce((s,e)=>s+targetTotal(e),0));return `<div class="card group-card" data-act="selectGroup" data-id="${g.id}"><div class="row between"><h3>${esc(g.name)}</h3><span class="pill lavender">${ee.length} чел.</span></div><div class="leader">Ведущий: ${esc(g.leader||'не указан')}</div><div class="row between"><strong>${money(paid)}</strong><span class="small">из ${money(targetSum)}</span></div><div class="progress"><span style="width:${Math.min(100,Math.round(paid/(targetSum||1)*100))}%"></span></div><div class="row between" style="margin-top:12px"><span class="small">${periods(g).length} платёжных периодов</span><span style="color:#6862c4;font-weight:750">Открыть ↗</span></div></div>`}).join('');return `<div class="section-gap"><div class="metrics">${metric('Участников',String(m.persons),'включая несколько групп')}${metric('Получено всего',money(m.received),'с учётом возвратов','green')}${metric('Просрочено',money(m.late),'по контрольным датам','red')}${metric('Полностью оплатили',String(m.full),`из ${m.persons} участий`,'purple')}</div><div class="cols3"><section class="card"><div class="row between"><h2>Просрочено</h2>${statusSpan('overdue',String(controlList('overdue').length))}</div><div style="margin-top:9px">${controlListMarkup('overdue')}</div></section><section class="card"><div class="row between"><h2>Оплатить сегодня</h2>${statusSpan('soon',String(controlList('today').length))}</div><div style="margin-top:9px">${controlListMarkup('today')}</div></section><section class="card"><div class="row between"><h2>В ближайшие 7 дней</h2>${statusSpan('future',String(controlList('week').length))}</div><div style="margin-top:9px">${controlListMarkup('week')}</div></section></div><div class="page-heading" style="margin:10px 0 -5px"><div><h2>Ваши группы</h2><p>Перейдите к таблице участников и платежей</p></div><button class="btn" data-act="groupEdit">＋ Новая группа</button></div><div class="cols3">${groups||'<div class="empty">Пока нет групп</div>'}</div>${db.settings?.demo?'<div class="banner-note">В журнал загружены <strong>демонстрационные клиенты и оплаты</strong> для знакомства с системой. Перед реальной работой сохраните копию при необходимости и <button class="btn smallbtn danger" data-act="clearDemo">Очистите всю базу и начните с нуля</button>.</div>':'<div class="banner-note">Ведите учёт на одном устройстве и регулярно переносите JSON-копию. Содержимое терапевтических сессий сюда не вносите.</div>'}</div>`}
function groupEnrollments(g){const search=ui.query.toLocaleLowerCase('ru-RU');return db.enrollments.filter(e=>e.groupId===g.id&&(!search||enrollmentClient(e)?.name.toLocaleLowerCase('ru-RU').includes(search))).sort((a,b)=>(enrollmentClient(a)?.name||'').localeCompare(enrollmentClient(b)?.name||'','ru'));}
function viewGroups(){const g=findGroup(ui.groupId)||db.groups[0];if(!g)return `<div class="card empty"><strong>Создайте первую группу</strong><button class="btn primary" data-act="groupEdit">＋ Создать группу</button></div>`;ui.groupId=g.id;const ens=groupEnrollments(g),all=db.enrollments.filter(e=>e.groupId===g.id),sum=metricsOf(today(),all);const blockOpts=[['','Все блоки']].concat(g.blocks.map(b=>[b.id,b.name]));const perOpts=[['','Все периоды']].concat(periods(g).filter(p=>!ui.blockId||p.blockId===ui.blockId).map(p=>[p.id,labelForPeriod(p)]));return `<div class="section-gap"><section class="card"><div class="controls">${field('Группа',select('groupSelect',groupOptions(),g.id,'data-control="group"'))}${field('Блок',select('blockSelect',blockOpts,ui.blockId,'data-control="block"'))}${field('Период',select('periodSelect',perOpts,ui.periodId,'data-control="period"'))}${field('Поиск по имени',`<input id="groupSearch" class="field" placeholder="Фамилия или имя" value="${esc(ui.query)}">`)}<div class="control-right row wrap"><button class="btn" data-act="toggleContacts">${ui.contacts?'Свернуть':'Показать'} контакты</button><button class="btn" data-act="groupEdit" data-id="${g.id}">⚙ Настроить</button><button class="btn primary" data-act="newPayment">＋ Внести оплату</button></div></div><div class="row between wrap" style="margin-bottom:12px"><div class="small">${all.length} участников · ${g.blocks.length} блок(ов) · ${periods(g).length} периодов · ведущий: ${esc(g.leader||'—')}</div><button class="btn smallbtn" data-act="newEnrollment" data-gid="${g.id}">＋ Добавить клиента</button></div><div id="group-table-host">${groupTable(g,ens)}</div><div class="row between wrap" style="margin-top:13px"><div class="small">Ячейка месяца показывает <strong>оплачено / начислено</strong>. Нажмите для деталей. Прокрутка таблицы горизонтально.</div><button class="btn smallbtn" data-act="export" data-type="group">↓ CSV этой группы</button></div></section><div class="metrics">${metric('Участников',String(all.length))}${metric('Стоимость по графику',money(sum.due))}${metric('Получено',money(sum.received),'с учётом возвратов','green')}${metric('Просрочено',money(sum.late),'по сегодняшней дате','red')}</div></div>`}
function groupTable(g,ens){const blocks=g.blocks.map(b=>({...b,periods:b.periods.filter(p=>(!ui.blockId||b.id===ui.blockId)&&(!ui.periodId||p.id===ui.periodId))})).filter(b=>b.periods.length);const visible=blocks.flatMap(b=>b.periods);const contact=ui.contacts;const colspan=visible.length+7+(contact?1:0);let rows=ens.map(e=>{const c=enrollmentClient(e),a=allocations(e.id);let cells=visible.map(p=>{const st=periodState(e,p),t=target(e,p);return `<td class="period-col cell-click ${p===visible[0]?'sep':''}" data-act="periodDetails" data-eid="${e.id}" data-pid="${p.id}" title="Показать операции и срок"><div class="cell-money">${money(st.paid)} <span class="muted">/ ${money(t)}</span></div><div style="margin-top:6px">${statusSpan(st.key,st.paid>0&&st.rest>0?`Частично · ${st.label}`:st.label)}</div>${st.rest>0?`<div class="subcell">Остаток: ${money(st.rest)}</div>`:''}</td>`}).join('');const next=nextDue(e);return `<tr><td class="sticky cell-name"><button class="linkbutton" data-act="clientCard" data-id="${e.clientId}">${esc(c?.name||'Без имени')}</button><div class="subcell">${statusNames[e.status]||'Активен'}</div></td>${contact?`<td class="nowrap"><div>${esc(c?.phone||'—')}</div><div class="subcell">${esc(c?.telegram||c?.email||'')}</div></td>`:''}<td class="nowrap">${esc(planNames[e.plan]||'Индивидуально')}</td>${cells}<td class="cell-money">${money(received(e.id))}</td><td class="cell-money ${outstanding(e)>0?'text-red':'text-green'}">${money(outstanding(e))}</td><td class="cell-money ${lateAmount(e)>0?'text-red':''}">${money(lateAmount(e))}</td><td class="nowrap">${next?`${formatDate(dueDate(e,next))}<div class="subcell">${money(Math.max(0,target(e,next)-paidOnPeriod(e,next)))}</div>`:'✓ Всё закрыто'}</td><td><button class="btn smallbtn" data-act="newPayment" data-eid="${e.id}">＋ Оплата</button></td></tr>`}).join('');const th=blocks.map(b=>`<th colspan="${b.periods.length}" class="sep">${esc(b.name)}</th>`).join('');const head=visible.map(p=>`<th class="period-col sep"><div>${esc(p.label)}</div><div class="subcell">${esc(formatMonth(p.start))}</div><div class="subcell">до ${formatDate(p.due)}</div></th>`).join('');const sum=(f)=>round(ens.reduce((a,e)=>a+f(e),0));const footer=visible.map(p=>`<td class="cell-money">${money(sum(e=>paidOnPeriod(e,p)))}</td>`).join('');return `<div class="table-scroller"><table class="data-table"><thead><tr class="blockhead"><th class="sticky" rowspan="2" style="min-width:215px;text-align:left">ФИО</th>${contact?'<th rowspan="2">Контакты</th>':''}<th rowspan="2">Вариант оплаты</th>${th}<th rowspan="2">Всего оплачено</th><th rowspan="2">Осталось</th><th rowspan="2">Просрочено</th><th rowspan="2">Следующий платёж</th><th rowspan="2">Действия</th></tr><tr class="subhead">${head}</tr></thead><tbody>${rows||`<tr><td colspan="${colspan}" class="empty">Участники не найдены</td></tr>`}</tbody><tfoot><tr><td class="sticky">ИТОГО · ${ens.length} чел.</td>${contact?'<td>—</td>':''}<td>—</td>${footer}<td>${money(sum(e=>received(e.id)))}</td><td>${money(sum(e=>outstanding(e)))}</td><td>${money(sum(e=>lateAmount(e)))}</td><td>—</td><td>—</td></tr></tfoot></table></div>`}
function viewClients(){let cs=[...db.clients].sort((a,b)=>a.name.localeCompare(b.name,'ru'));if(ui.clientQuery)cs=cs.filter(c=>c.name.toLocaleLowerCase('ru-RU').includes(ui.clientQuery.toLocaleLowerCase('ru-RU')));return `<section class="card"><div class="page-heading"><div><h2>Клиенты</h2><p>Участие в нескольких группах учитывается отдельно</p></div><button class="btn primary" data-act="newClient">＋ Добавить клиента</button></div><div class="controls">${field('Поиск клиента',`<input id="clientsSearch" class="field" value="${esc(ui.clientQuery||'')}" placeholder="ФИО" />`)}<div class="small" style="align-self:center">Найдено: ${cs.length}</div></div><div class="cols3">${cs.map(c=>{const es=db.enrollments.filter(e=>e.clientId===c.id);return `<div class="card group-card" data-act="clientCard" data-id="${c.id}"><div class="client-head"><span class="avatar">${esc(c.name.split(' ').slice(0,2).map(a=>a[0]).join(''))}</span><div><h3>${esc(c.name)}</h3><div class="small">${es.length} групп(ы)</div></div></div><div style="margin:14px 0 8px">${es.map(e=>`<div class="row between" style="margin:4px 0"><span class="small">${esc(enrollmentGroup(e)?.name)}</span><strong>${money(received(e.id))}</strong></div>`).join('')}</div><div class="row between" style="padding-top:10px;border-top:1px solid #eee"><span class="small">Осталось оплатить</span><strong class="text-red">${money(es.reduce((s,e)=>s+outstanding(e),0))}</strong></div></div>`}).join('')||'<div class="empty"><strong>Клиенты не найдены</strong></div>'}</div></section>`}
function allPaymentRows(){const s=ui.paymentQuery?.toLocaleLowerCase('ru-RU')||'';let pp=[...db.payments].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));if(ui.paymentFilter==='payment'||ui.paymentFilter==='refund'||ui.paymentFilter==='voided')pp=pp.filter(p=>ui.paymentFilter==='voided'?p.voided:p.kind===ui.paymentFilter&&!p.voided);else pp=pp.filter(p=>!p.voided);if(s)pp=pp.filter(p=>{const e=findEnrollment(p.enrollmentId);return `${enrollmentClient(e)?.name||''} ${enrollmentGroup(e)?.name||''} ${p.comment||''}`.toLocaleLowerCase('ru-RU').includes(s)});return pp;}
function viewPayments(){const pp=allPaymentRows(),paymentSum=round(pp.filter(p=>p.kind==='payment'&&!p.voided).reduce((s,p)=>s+p.amount,0)),refundSum=round(pp.filter(p=>p.kind==='refund'&&!p.voided).reduce((s,p)=>s+p.amount,0));return `<div class="section-gap"><div class="metrics">${metric('Поступления в журнале',money(paymentSum))}${metric('Возвраты в журнале',money(refundSum),'вычитаются из поступлений','red')}${metric('Чистые поступления',money(paymentSum-refundSum),'без дублирования месяцев','green')}${metric('Операций в выборке',String(pp.length))}</div><section class="card"><div class="page-heading"><div><h2>Журнал операций</h2><p>Фактическая дата получения денег и назначение платежа</p></div><div class="row wrap"><button class="btn" data-act="newRefund">↩ Возврат</button><button class="btn primary" data-act="newPayment">＋ Внести оплату</button></div></div><div class="controls">${field('Тип',select('paymentFilter',[['all','Все действующие'],['payment','Оплаты'],['refund','Возвраты'],['voided','Отменённые']],ui.paymentFilter,'data-control="paymentFilter"'))}${field('Поиск',`<input class="field" id="paymentsSearch" placeholder="Клиент, группа, комментарий" value="${esc(ui.paymentQuery||'')}">`)}</div><div class="table-scroller"><table class="data-table"><thead><tr><th>Дата</th><th>Клиент</th><th>Группа</th><th>Тип</th><th>Сумма</th><th>Периоды назначения</th><th>Способ</th><th>Операции</th></tr></thead><tbody>${pp.map(p=>{const e=findEnrollment(p.enrollmentId),g=enrollmentGroup(e);return `<tr><td class="nowrap">${formatDate(p.date)}</td><td><button class="linkbutton" data-act="clientCard" data-id="${e.clientId}">${esc(enrollmentClient(e)?.name)}</button></td><td>${esc(g?.name)}</td><td>${p.voided?statusSpan('neutral','Отменено'):p.kind==='refund'?statusSpan('overdue','Возврат'):statusSpan('paid','Оплата')}</td><td class="cell-money ${p.kind==='refund'?'text-red':'text-green'}">${p.kind==='refund'?'−':'+'}${money(p.amount)}</td><td>${(p.allocations||[]).map(a=>{const t=periods(g).find(x=>x.id===a.periodId);return t?`${esc(t.label)} (${money(a.amount)})`:''}).filter(Boolean).join('<div class="subcell">')||'<span class="muted">Аванс без назначения</span>'}</td><td>${esc(methodNames[p.method]||'—')}</td><td class="nowrap"><button class="btn smallbtn" data-act="paymentDetails" data-id="${p.id}">Детали</button></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Операций пока нет</td></tr>'}</tbody></table></div></section></div>`}
function reportSelection(){const f=ui.report;let ens=db.enrollments.filter(e=>(f.group==='all'||e.groupId===f.group)&&(f.client==='all'||e.clientId===f.client));if(f.status!=='all')ens=ens.filter(e=>e.status===f.status);return ens;}
function reportPeriods(e){const f=ui.report;return periods(enrollmentGroup(e)).filter(p=>{if((f.block!=='all'&&p.blockId!==f.block)||(f.period!=='all'&&p.id!==f.period))return false;if(!f.paymentStatus||f.paymentStatus==='all')return true;const st=periodState(e,p,f.asof);if(f.paymentStatus==='partial')return st.paid>0&&st.rest>0;if(f.paymentStatus==='paid')return st.key==='paid';return st.key===f.paymentStatus;});}
function reportMetrics(){const f=ui.report,ens=reportSelection();let expected=0,overdue=0,future=0,covered=0;let collected=0,refunded=0;const dates={from:f.from,to:f.to,asof:f.asof};const filterByPeriod=f.block!=='all'||f.period!=='all';for(const e of ens){const pids=new Set(reportPeriods(e).map(x=>x.id));const net=allocations(e.id,f.asof);let complete=true;for(const p of reportPeriods(e)){const t=target(e,p),due=dueDate(e,p),left=Math.max(0,round(t-(net[p.id]||0)));if(due>=f.from&&due<=f.to)expected+=t;if(due<f.asof)overdue+=left;if(due>f.asof)future+=left;if(left>.009)complete=false;}if(complete&&reportPeriods(e).length)covered++;for(const pay of db.payments){if(pay.voided||pay.enrollmentId!==e.id||pay.date<f.from||pay.date>f.to)continue;const val=filterByPeriod?pay.allocations.filter(a=>pids.has(a.periodId)).reduce((s,a)=>s+a.amount,0):pay.amount;if(pay.kind==='refund')refunded+=val;else collected+=val;}}
return{expected:round(expected),overdue:round(overdue),future:round(future),collected:round(collected),refunded:round(refunded),covered,ens};}
function viewReports(){let f=ui.report;const groupList=[['all','Все группы']].concat(db.groups.map(g=>[g.id,g.name]));const blocks=[['all','Все блоки']].concat(db.groups.filter(g=>f.group==='all'||g.id===f.group).flatMap(g=>g.blocks.map(b=>[b.id,`${g.name} · ${b.name}`])));const periodOpts=[['all','Все периоды']].concat(db.groups.filter(g=>f.group==='all'||g.id===f.group).flatMap(g=>periods(g).filter(p=>f.block==='all'||p.blockId===f.block).map(p=>[p.id,`${g.name} · ${labelForPeriod(p)}`])));const cOpts=[['all','Все клиенты']].concat(db.clients.map(c=>[c.id,c.name]));const m=reportMetrics();let debtors=m.ens.map(e=>({e,late:reportPeriods(e).reduce((s,p)=>s+(dueDate(e,p)<f.asof?Math.max(0,target(e,p)-(allocations(e.id,f.asof)[p.id]||0)):0),0)})).filter(x=>x.late>.009).sort((a,b)=>b.late-a.late);let cash=db.payments.filter(p=>!p.voided&&p.date>=f.from&&p.date<=f.to&&m.ens.some(e=>e.id===p.enrollmentId));if(f.block!=='all'||f.period!=='all')cash=cash.filter(p=>p.allocations.some(a=>reportPeriods(findEnrollment(p.enrollmentId)).some(q=>q.id===a.periodId)));return `<section class="section-gap"><div class="card"><div class="page-heading"><div><h2>Фильтры отчёта</h2><p>Время получения денег не совпадает с месяцем, за который они внесены</p></div><button class="btn" data-act="export" data-type="report">↓ CSV поступлений</button></div><div class="report-controls">${field('Группа',select('reportGroup',groupList,f.group,'data-report="group"'))}${field('Блок',select('reportBlock',blocks,f.block,'data-report="block"'))}${field('Период обучения',select('reportPeriod',periodOpts,f.period,'data-report="period"'))}${field('Клиент',select('reportClient',cOpts,f.client,'data-report="client"'))}${field('Статус участия',select('reportStatus',[['all','Все статусы'],...Object.entries(statusNames)],f.status,'data-report="status"'))}${field('Статус оплаты',select('reportPayStatus',[['all','Любой'],['paid','Оплачено'],['partial','Частичная оплата'],['overdue','Просрочено'],['soon','Скоро срок'],['future','Будущие платежи']],f.paymentStatus||'all','data-report="paymentStatus"'))}${field('Поступления / сроки от',input('reportFrom',f.from,'date','data-report="from"'))}${field('По',input('reportTo',f.to,'date','data-report="to"'))}${field('Задолженность на дату',input('reportAsOf',f.asof,'date','data-report="asof"'))}</div></div><div class="metrics">${metric('Ожидаемые по графику',money(m.expected),'сроки внутри периода','purple')}${metric('Фактически получено',money(m.collected),'по дате операции','green')}${metric('Просрочено на дату',money(m.overdue),formatDate(f.asof),'red')}${metric('Будущие платежи',money(m.future),'по графику','cyan')}</div><div class="metrics">${metric('Возвраты отдельно',money(m.refunded),'по дате операции','red')}${metric('Чистые поступления',money(m.collected-m.refunded),'получено − возвраты','green')}${metric('Полностью оплатили',String(m.covered),'в выбранных периодах')}${metric('Участий в выборке',String(m.ens.length))}</div><div class="cols2"><div class="card"><div class="page-heading"><div><h2>Должники</h2><p>По состоянию на ${formatDate(f.asof)}</p></div><button class="btn smallbtn" data-act="export" data-type="debtors">↓ CSV</button></div>${debtors.length?debtors.slice(0,18).map(x=>`<div class="listrow"><div><button class="linkbutton" data-act="clientCard" data-id="${x.e.clientId}">${esc(enrollmentClient(x.e)?.name)}</button><div class="small">${esc(enrollmentGroup(x.e)?.name)}</div></div><strong class="text-red">${money(x.late)}</strong></div>`).join(''):`<div class="empty">Нет просроченной задолженности</div>`}</div><div class="card"><div class="page-heading"><div><h2>Движение денег</h2><p>За период ${formatDate(f.from)} — ${formatDate(f.to)}</p></div></div><div class="scroll-y">${cash.length?cash.sort((a,b)=>b.date.localeCompare(a.date)).map(p=>{const e=findEnrollment(p.enrollmentId);return `<div class="listrow"><div><div><button class="linkbutton" data-act="paymentDetails" data-id="${p.id}">${esc(enrollmentClient(e)?.name)}</button></div><div class="small">${formatDate(p.date)} · ${esc(enrollmentGroup(e)?.name)}</div></div><strong class="${p.kind==='refund'?'text-red':'text-green'}">${p.kind==='refund'?'−':'+'}${money((f.block!=='all'||f.period!=='all')?p.allocations.filter(a=>reportPeriods(e).some(q=>q.id===a.periodId)).reduce((s,a)=>s+a.amount,0):p.amount)}</strong></div>`}).join(''):'<div class="empty">Нет операций</div>'}</div></div></div><div class="card"><h2>Выгрузки</h2><p class="muted" style="margin:7px 0 16px">CSV в кодировке UTF-8 c BOM открывается в Excel с корректной кириллицей. Фильтры применяются к отчётам и должникам.</p><div class="actionline"><button class="btn" data-act="export" data-type="report">↓ Поступления за период</button><button class="btn" data-act="export" data-type="debtors">↓ Список должников</button><button class="btn" data-act="export" data-type="group">↓ Таблица группы</button><button class="btn" data-act="export" data-type="all">↓ Весь журнал операций</button><button class="btn" data-act="backup">↓ Полная JSON-копия</button></div></div></section>`}
function modalFrame(title,body,footer='',wide=false){return `<div class="modal-backdrop" id="modalback"><div class="modal-panel ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><div><h2>${esc(title)}</h2></div><button class="btn ghost" data-act="closeModal" aria-label="Закрыть">✕</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</div></div>`}

function createEnrollmentDraft(clientId,gId,eId=null){const existing=eId?findEnrollment(eId):null;const g=findGroup(gId)||db.groups[0];return{clientId,groupId:g.id,joined:existing?.joined||g.startDate,plan:existing?.plan||'monthly',status:existing?.status||'active',notes:existing?.notes||'',scheduleNotes:existing?.scheduleNotes||'',amounts:Object.fromEntries(periods(g).map(p=>[p.id,existing?target(existing,p):p.price])),dates:Object.fromEntries(periods(g).map(p=>[p.id,existing?dueDate(existing,p):p.due])),initialAmount:0,initialDate:today(),initialMethod:'bank'};}
function enrollmentModal(m){const d=m.draft;const g=findGroup(d.groupId);if(!g)return modalFrame('Участие','Сначала создайте группу');const exists=!!m.id;const fullCost=periods(g).reduce((s,p)=>s+p.price,0);const currentCost=periods(g).reduce((s,p)=>s+Number(d.amounts[p.id]??p.price),0);const body=`<form id="enrollmentForm" onsubmit="return false"><div class="formgrid"><div class="input-group span2"><div class="label">Клиент</div><div class="field" style="background:#f8f9fb">${esc(findClient(d.clientId)?.name||'Новый клиент')}</div></div>${field('Группа',select('e_group',db.groups.map(g=>[g.id,g.name]),d.groupId,exists?'disabled':'data-enrollment="group"'))}${field('Дата присоединения',input('e_joined',d.joined,'date'))}${field('Вариант оплаты',select('e_plan',Object.entries(planNames),d.plan))}${field('Статус участия',select('e_status',Object.entries(statusNames),d.status))}<label class="input-group span2"><span class="label">Согласованный график / комментарий</span><textarea name="e_notes" class="field" rows="2">${esc(d.notes)}</textarea></label></div><div class="form-section"><div class="row between wrap"><div><h3>Индивидуальный график платежей</h3><div class="hint">Стандартная стоимость группы: ${money(fullCost)}</div></div><button class="btn smallbtn" data-act="resetAmounts">↻ Базовые цены</button></div><div class="formgrid" style="margin:12px 0">${field('Итоговая согласованная цена, ₽',input('e_agreedTotal',currentCost,'number','min="0" step="0.01"'))}<div class="input-group" style="align-self:end"><button class="btn" data-act="scaleAmounts">Распределить цену по месяцам</button></div></div><div class="table-scroller"><table class="mini-table"><thead><tr><th>Блок / месяц</th><th>Базовая</th><th>Сумма по договорённости</th><th>Срок оплаты</th></tr></thead><tbody>${periods(g).map(p=>`<tr><td><strong>${esc(p.blockName)}</strong><div class="small">${esc(labelForPeriod(p))}</div></td><td>${money(p.price)}</td><td>${input('e_price_'+p.id,d.amounts[p.id]??p.price,'number','min="0" step="0.01" style="width:135px"')}</td><td>${exists?`${formatDate(d.dates[p.id]||p.due)}<div class="small">Перенос срока в карточке</div>`:input('e_due_'+p.id,d.dates[p.id]||p.due,'date')}</td></tr>`).join('')}</tbody></table></div><div id="enrollmentTotal" class="form-note">Плановая стоимость: ${money(currentCost)} · скидка: ${money(fullCost-currentCost)}</div></div>${exists?'':`<div class="form-section"><h3>Уже полученная оплата (необязательно)</h3><div class="formgrid cols3form">${field('Сумма, ₽',input('e_initialAmount',0,'number','min="0" step="0.01"'))}${field('Фактическая дата',input('e_initialDate',today(),'date'))}${field('Способ',select('e_initialMethod',Object.entries(methodNames),'bank'))}</div><div class="form-note">Создаст одну реальную операцию оплаты. Сумма автоматически распределится по самым ранним неоплаченным периодам.</div></div>`}</form>`;return modalFrame(exists?'Изменить участие в группе':'Добавить в группу',body,`<button class="btn" data-act="closeModal">Отмена</button><button class="btn primary" data-act="saveEnrollment">${exists?'Сохранить':'Добавить участника'}</button>`,true)}
function clientCardModal(m){const c=findClient(m.id);if(!c)return'';const es=db.enrollments.filter(e=>e.clientId===c.id);const sections=es.map(e=>{const g=enrollmentGroup(e),t=targetTotal(e),r=received(e.id),late=lateAmount(e),next=nextDue(e),payments=db.payments.filter(p=>p.enrollmentId===e.id&&!p.voided).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="form-section"><div class="row between wrap"><div><h3>${esc(g?.name||'Группа')}</h3><div class="hint">Ведущий: ${esc(g?.leader||'—')} · с ${formatDate(e.joined)} · ${esc(planNames[e.plan])}</div></div><div class="row"><span class="pill lavender">${statusNames[e.status]}</span><button class="btn smallbtn" data-act="editEnrollment" data-id="${e.id}">Изменить график</button><button class="btn smallbtn primary" data-act="newPayment" data-eid="${e.id}">＋ Оплата</button></div></div><div class="metrics" style="margin-top:13px">${metric('Стоимость',money(t))}${metric('Оплачено',money(r),'с учётом возвратов','green')}${metric('Осталось',money(outstanding(e)),'по всей программе','red')}${metric('Просрочено',money(late),'на текущую дату','red')}</div><div class="row between wrap" style="margin:13px 0"><span class="small">Ближайший срок: <strong>${next?formatDate(dueDate(e,next)):'все платежи закрыты'}</strong></span>${credit(e)>.009?`<span class="status soon">Аванс без распределения: ${money(credit(e))}</span>`:''}</div><div class="table-scroller"><table class="mini-table"><thead><tr><th>Период</th><th>Начислено</th><th>Оплачено</th><th>Контрольная дата</th><th>Статус</th></tr></thead><tbody>${periods(g).filter(p=>target(e,p)>0).map(p=>{const st=periodState(e,p);return `<tr class="interactive-row" data-act="periodDetails" data-eid="${e.id}" data-pid="${p.id}"><td>${esc(labelForPeriod(p))}</td><td>${money(target(e,p))}</td><td>${money(st.paid)}</td><td>${formatDate(dueDate(e,p))} <button class="togglebutton" data-act="dueEdit" data-eid="${e.id}" data-pid="${p.id}">Изменить</button></td><td>${statusSpan(st.key,st.label)}${st.rest>0?`<div class="subcell">${money(st.rest)} осталось</div>`:''}</td></tr>`}).join('')}</tbody></table></div><div class="row between wrap" style="margin:18px 0 8px"><h3>История платежей</h3><button class="btn smallbtn" data-act="export" data-type="clientHistory" data-eid="${e.id}">↓ CSV истории</button></div>${payments.length?`<div class="scroll-y">${payments.map(p=>`<div class="listrow"><div><button class="linkbutton" data-act="paymentDetails" data-id="${p.id}">${formatDate(p.date)} · ${p.kind==='refund'?'Возврат':'Оплата'}</button><div class="meta">${esc(p.allocations.map(a=>periods(g).find(k=>k.id===a.periodId)?.label||'').filter(Boolean).join(', ')||'Аванс')} · ${esc(methodNames[p.method]||'—')}</div></div><strong class="${p.kind==='refund'?'text-red':'text-green'}">${p.kind==='refund'?'−':'+'}${money(p.amount)}</strong></div>`).join('')}</div>`:`<div class="small" style="margin:10px 0">Оплат пока нет.</div>`}${e.dueHistory?.length?`<details style="margin-top:10px"><summary>История переноса сроков (${e.dueHistory.length})</summary>${e.dueHistory.map(h=>`<div class="audit">${formatDate(h.old)} → ${formatDate(h.new)} · ${esc(h.reason)}<div class="small">${new Date(h.at).toLocaleString('ru-RU')}</div></div>`).join('')}</details>`:''}</div>`}).join('');const body=`<div class="row between wrap"><div class="client-head"><span class="avatar">${esc(c.name.split(' ').slice(0,2).map(s=>s[0]).join(''))}</span><div><h2>${esc(c.name)}</h2><div class="small">${es.length} участий в группах</div></div></div><button class="btn smallbtn" data-act="editClient" data-id="${c.id}">✎ Контакты</button></div><div class="detail-grid" style="margin:17px 0">${[['E-mail',c.email],['Телефон',c.phone],['Telegram',c.telegram],['Комментарий по оплате',c.comment]].map(([k,v])=>`<div class="detail-item"><div class="label">${k}</div><div>${esc(v||'—')}</div></div>`).join('')}</div><div class="row between wrap"><h3>Участие в группах</h3><button class="btn smallbtn" data-act="newEnrollmen function scaleMap(amts,desired){const keys=Object.keys(amts),sum=round(Object.values(amts).reduce((a,b)=>a+Number(b),0));if(!keys.length)return{};if(sum===0){const each=round(desired/keys.length);const res=Object.fromEntries(keys.map(k=>[k,each]));res[keys[keys.length-1]]=round(desired-each*(keys.length-1));return res}let running=0;const res={};keys.forEach((k,i)=>{const v=i===keys.length-1?round(desired-running):round(desired*amts[k]/sum);res[k]=v;running=round(running+v)});return res}

function updatePaymentPreview(){const form=$('#paymentForm');if(!form)return;const m=ui.modal,e=findEnrollment(form.elements.namedItem('pay_enrollment')?.value||m.eid),g=enrollmentGroup(e);if(!e)return;const amount=Number(form.elements.namedItem('pay_amount')?.value||0);const allocFields=$$('.allocation');const a=Object.fromEntries(allocFields.map(el=>[el.dataset.pid,round(Number(el.value)||0)]));const allocated=round(Object.values(a).reduce((s,v)=>s+v,0));const kind=m.kind||'payment';const leftover=round(amount-allocated);const errors=[];if(!Number.isFinite(amount)||amount<=0)errors.push('Укажите сумму больше нуля.');if(leftover<-.009)errors.push('Распределено больше суммы операции.');if(kind==='refund'&&amount>received(e.id,null,m.id)+.009)errors.push('Сумма возврата больше доступных средств.');const current=allocations(e.id,null,m.id);const existingCredit=Math.max(0,round(received(e.id,null,m.id)-Object.values(current).reduce((s,v)=>s+v,0)));if(kind==='refund'&&leftover>existingCredit+.009)errors.push('Нераспределённая часть возврата не может превышать имеющийся аванс без назначения.');let closed=[],partial=[];for(const p of periods(g)){const val=a[p.id]||0;if(val<=.009)continue;const before=current[p.id]||0,limit=kind==='refund'?Math.max(0,before):Math.max(0,target(e,p)-before);if(val>limit+.009)errors.push(`${p.label}: можно распределить не больше ${money(limit)}.`);const after=before+(kind==='refund'?-val:val);const debt=Math.max(0,target(e,p)-after);if(debt<=.009)closed.push(p.label);else partial.push(`${p.label} (остаток ${money(debt)})`)}const netAfter=received(e.id,null,m.id)+(kind==='refund'?-amount:amount);const totalRest=Math.max(0,round(targetTotal(e)-netAfter));const el=$('#paymentPreview');if(el)el.innerHTML=`<div class="row between wrap"><strong>Распределено: ${money(allocated)} из ${money(amount)}</strong><strong>Остаток по программе: ${money(totalRest)}</strong></div>${closed.length?`<div style="margin-top:9px">✓ Будут закрыты: <strong>${esc(close function autoPaymentForm(){const form=$('#paymentForm');if(!form)return;const m=ui.modal,e=findEnrollment(form.elements.namedItem('pay_enrollment')?.value||m.eid);const amount=round(Number(form.elements.namedItem('pay_amount')?.value||0));const block=form.elements.namedItem('pay_block')?.value||'all';const first=autoAllocate(e,amount,m.kind||'payment',m.id);let alloc=first.a;if(block!=='all'){const eligible=periods(enrollmentGroup(e)).filter(p=>p.blockId===block);const old=allocations(e.id,null,m.id);const unapplied=Math.max(0,round(received(e.id,null,m.id)-Object.values(old).reduce((s,v)=>s+v,0)));let left=round(amount-((m.kind==='refund')?Math.min(amount,unapplied):0));alloc={};for(const p of (m.kind==='refund'?[...eligible].reverse():eligible)){const limit=(m.kind==='refund')?Math.max(0,old[p.id]||0):Math.max(0,target(e,p)-(old[p.id]||0));const v=round(Math.min(left,limit));if(v>.009){alloc[p.id]=v;left=round(left-v)}}}for(const el of $$('.allocation'))el.value=alloc[el.dataset.pid]||0;updatePaymentPreview();}

function openPayment(kind='payment',eid=null,pid=null,fromPaymentId=null){if(!db.enrollments.length){alert('Сначала добавьте участника в группу.');return}const p=fromPaymentId?db.payments.find(v=>v.id===fromPaymentId):null;const effectiveEid=eid||p?.enrollmentId||(ui.page==='groups'?db.enrollments.find(e=>e.groupId===ui.groupId)?.id:null)||db.enrollments[0].id;const effective=findEnrollment(effectiveEid);let amount=0,alloc={};if(pid){const pr=periods(enrollmentGroup(effective)).find(p=>p.id===pid);if(pr){amount=Math.max(0,target(effective,pr)-paidOnPeriod(effective,pr));alloc={[pid]:amount}}}else if(fromPaymentId&&p){amount=Math.min(p.amount,received(effective.id));alloc=autoAllocate(effective,amount,'refund').a}setModal({type:'payment',kind,eid:effectiveEid,amount,allocations:alloc});}
function saveGroup(){syncGroupDraft();const m=ui.modal,g=m.draft;if(!g.name.trim()){alert('Укажите название группы');return}if(!g.blocks.length||g.blocks.some(b=>!b.periods.length)){alert('В каждом блоке нужен хотя бы один период');return}for(const p of periods(g)){if(!p.start||!p.end||!p.due||p.end<p.start||p.price<0){alert('Проверьте даты и стоимость периодов');return}}change(()=>{if(m.id){const at=db.groups.findIndex(x=>x.id===m.id);db.groups[at]=g;audit('edit_group',g.id,`Обновлена группа «${g.name}»`)}else{db.groups.push(g);ui.groupId=g.id;audit('new_group',g.id,`Создана группа «${g.name}»`)}ui.page='groups';ui.blockId='';ui.periodId='';ui.modal=null},'Настройки группы сохранены')}
function saveClientBase(){const f=$('#clientBaseForm'),fd=new FormData(f);const name=String(fd.get('c_name')||'').trim();if(!name){alert('Укажите ФИО');return}if(fd.get('c_email')&&f.elements.namedItem('c_email').validity.typeMismatch){alert('Проверьте адрес электронной почты');return}const data={name,email:String(fd.get('c_email')||''),phone:String(fd.get('c_phone')||''),telegram:String(fd.get('c_telegram')||''),comment:String(fd.get('c_comment')||'')};const m=ui.modal;let cid=m.id||id();change(()=>{if(m.id){Object.assign(findClient(cid),data);audit('edit_client',cid,`Контакты клиента ${name}`)}else{db.clients.push({id:cid,...data});audit('new_client',cid,`Добавлен клиент ${name}`)}ui.modal=null},'Карточка клиента сохранена');if(!m.id&&db.groups.length){setModal({type:'enrollment',id:null,draft:createEnrollmentDraft(cid,ui.groupId||db.groups[0].id)})}else if(m.id){setModal({type:'clientCard',id:cid})}}
function saveEnrollment(){syncEnrollmentDraft();const m=ui.modal,d=m.draft,g=findGroup(d.groupId);if(!g){alert('Выберите группу');return}if(!d.joined){alert('Укажите дату присоединения');return}if(!m.id&&db.enrollments.some(e=>e.clientId===d.clientId&&e.groupId===d.groupId)){alert('Этот клиент уже состоит в выбранной группе. Откройте его карточку, чтобы изменить условия.');return}if(!Number.isFinite(d.agreedTotal)||d.agreedTotal<0){alert('Укажите согласованную сумму');return}let amts=Object.fromEntries(periods(g).map(p=>[p.id,round(Number(d.amounts[p.id]||0))]));let sum=round(Object.values(amts).reduce((s,v)=>s+v,0));if(Math.abs(sum-d.agreedTotal)>.009){amts=scaleMap(amts,d.agreedTotal);sum=round(Object.values(amts).reduce((s,v)=>s+v,0))}if(Object.values(amts).some(v=>v<0)){alert('Сумма не может быть отрицательной');return}if(m.id&&received(m.id)>sum){if(!confirm('По новым условиям уже получено больше согласованной суммы. Сохранить и оставить переплату?'))return}if(!m.id&&d.initialAmount>0&&d.initialDate>today()){alert('Фактическая оплата не может иметь будущую дату');return}if(!m.id&&d.initialAmount<0){alert('Укажите сумму не меньше нуля');return}const eId=m.id||id(),cid=d.clientId;change(()=>{if(m.id){const e=findEnrollment(eId);Object.assign(e,{plan:d.plan,status:d.status,joined:d.joined,notes:d.notes,amounts:amts});audit('edit_enrollment',eId,`Изменены условия участия ${enrollmentClient(e)?.name}`)}else{const e={id:eId,clientId:cid,groupId:g.id,joined:d.joined,plan:d.plan,status:d.status,amounts:amts,dueDates:d.dates,dueHistory:[],notes:d.notes,scheduleNotes:''};db.enrollments.push(e);audit('new_enrollment',eId,`Участие ${findClient(cid)?.name} в ${g.name}`);if(d.initialAmount>.009){const v=autoAllocate(e,d.initialAmount);const p={id:id(),enrollmentId:eId,kind:'payment',amount:round(d.initialAmount),date:d.initialDate,method:d.initialMethod,comment:'Оплата, внесённая при добавлении клиента',allocations:Object.entries(v.a).map(([periodId,amount])=>({periodId,amount})),createdAt:nowIso(),audit:[],voided:false};db.payments.push(p);audit('new_payment',p.id,`Начальная оплата ${money(p.amount)}`)}}ui.modal=null;ui.groupId=g.id;ui.page='groups'},'График участника сохранён');setModal({type:'clientCard',id:cid})}
function savePayment(){const form=$('#paymentForm');if(!form)return;const valid=updatePaymentPreview();if(!valid||valid.errors.length){alert((valid?.errors||['Проверьте данные']).join('\n'));return}const fd=new FormData(form),date=String(fd.get('pay_date')||'');if(!date){alert('Укажите дату операции');return}if(date>today()){alert('Это журнал фактически полученных денег. Будущую дату нельзя сохранить как состоявшуюся оплату.');return}const amount=round(valid.amount),m=ui.modal,alloc=Object.entries(valid.a).filter(([,v])=>v>.009).map(([periodId,v])=>({periodId,amount:round(v)}));if(valid.kind==='payment'&&valid.leftover>.009&&!confirm(`Остаётся ${money(valid.leftover)} без назначения. Это будет авансом. Сохранить?`))return;const original=m.id?db.payments.find(p=>p.id===m.id):null;const p={id:m.id||id(),enrollmentId:valid.e.id,kind:m.kind||'payment',amount,date,method:String(fd.get('pay_method')||'bank'),comment:String(fd.get('pay_note')||''),allocations:alloc,createdAt:original?.createdAt||nowIso(),audit:original?.audit||[],voided:false};change(()=>{if(original){const before=structuredClone(original);original.audit=original.audit||[];original.audit.push({at:nowIso(),action:'Исправление операции',details:`Было ${money(before.amount)} от ${formatDate(before.date)}; стало ${money(p.amount)} от ${formatDate(p.date)}`,before:{date:before.date,amount:before.amount,method:before.method,comment:before.comment,allocations:before.allocations}});Object.assign(original,{amount:p.amount,date:p.date,method:p.method,comment:p.comment,allocations:p.allocations});audit('edit_payment',p.id,`Изменена операция ${money(p.amount)}`)}else{db.payments.push(p);audit('new_payment',p.id,`${p.kind==='refund'?'Возврат':'Оплата'} ${money(p.amount)}`)}ui.modal=null},'Операция сохранена, расчёты обновлены');setModal({type:'paymentDetails',id:p.id})}
function voidPayment(payId){const p=db.payments.find(p=>p.id===payId);if(!p||p.voided)return;if(!confirm(`Отменить операцию ${money(p.amount)} от ${formatDate(p.date)}? Она останется в журнале и истории изменений, но перестанет учитываться в расчётах.`))return;change(()=>{p.voided=true;p.audit=p.audit||[];p.audit.push({at:nowIso(),action:'Операция отменена',details:'Исключена из финансовых расчётов, сохранена для аудита'});audit('void_payment',p.id,`Отменена операция ${money(p.amount)}`);ui.modal=null},'Операция отменена, история сохранена');setModal({type:'paymentDetails',id:payId})}
function saveDue(){const f=$('#dueForm');if(!f)return;const fd=new FormData(f),date=fd.get('due_new'),reason=String(fd.get('due_reason')||'').trim();if(!date||!reason){alert('Укажите новую дату и причину переноса');return}const m=ui.modal,e=findEnrollment(m.eid),g=enrollmentGroup(e),p=periods(g).find(p=>p.id===m.pid),old=dueDate(e,p);if(date===old){toast('Дата не изменилась');return}change(()=>{e.dueDates=e.dueDates||{};e.dueHistory=e.dueHistory||[];e.dueDates[p.id]=date;e.dueHistory.push({periodId:p.id,old,new:date,original:p.due,reason,at:nowIso()});audit('due_update',e.id,`Отсрочка ${p.label}: ${old} → ${date}`);ui.modal=null},'Контрольная дата перенесена');setModal({type:'periodDetails',eid:e.id,pid:p.id})}
function safeDownload(blob,filename){const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function downloadBackup(){db.settings=db.settings||{};db.settings.lastBackupAt=nowIso();store();const content=JSON.stringify(db,null,2);safeDownload(new Blob([content],{type:'application/json;charset=utf-8'}),`Психология_Просто_резервная_копия_${today()}.json`);render();toast('Полная копия JSON скачана. Сохраните её в безопасном месте.')}
function validateBackup(d){if(!d||typeof d!=='object'||!Array.isArray(d.groups)||!Array.isArray(d.clients)||!Array.isArray(d.enrollments)||!Array.isArray(d.payments))return false;for(const g of d.groups){if(!g.id||!Array.isArray(g.blocks)||g.blocks.some(b=>!Array.isArray(b.periods)))return false}for(const p of d.payments){if(!p.id||!p.enrollmentId||!Array.isArray(p.allocations)||!Number.isFinite(Number(p.amount)))return false}return true}
async function importBackup(file){if(!file)return;try{const raw=await file.text();const data=JSON.parse(raw);if(!validateBackup(data))throw Error('Это не резервная копия журнала оплат.');if(!confirm(`Восстановить резервную копию? Текущие ${db.groups.length} групп(ы), ${db.clients.length} клиентов и ${db.payments.length} операций будут ЗАМЕНЕНЫ данными из файла. Рекомендуется сначала сохранить нынешнюю копию.`))return;db={...data,audit:data.audit||[],settings:data.settings||{},updatedAt:data.updatedAt||nowIso()};ui.groupId=db.groups[0]?.id||'';ui.blockId='';ui.periodId='';ui.modal=null;ui.page='overview';store();render();toast('Резервная копия восстановлена: клиенты, графики и платежи.')}catch(err){alert('Не получилось восстановить: '+err.message)}}
function csvEsc(v){let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csvFile(rows,filename){const text='\ufeff'+rows.map(row=>row.map(csvEsc).join(';')).join('\r\n');safeDownload(new Blob([text],{type:'text/csv;charset=utf-8'}),filename+'.csv');toast('CSV скачан, кириллица сохранена.')}
function exportCSV(type,eId=null){let rows=[],name=`Психология_Просто_${type}_${today()}`;const f=ui.report;if(type==='all'||type==='report'){rows=[['Дата оплаты','Тип','Клиент','Группа','Сумма операции, ₽','В выбранных периодах, ₽','Способ','Периоды назначения','Комментарий','ID операции']];let list=type==='report'?db.payments.filter(p=>!p.voided&&p.date>=f.from&&p.date<=f.to&&reportSelection().some(e=>e.id===p.enrollmentId)):db.payments.filter(p=>!p.voided);for(const p of list){const e=findEnrollment(p.enrollmentId);if(type==='report'&&(f.block!=='all'||f.period!=='all')&&!p.allocations.some(a=>reportPeriods(e).some(v=>v.id===a.periodId)))continue;const g=enrollmentGroup(e);rows.push([p.date,p.kind==='refund'?'Возврат':'Оплата',enrollmentClient(e)?.name,g?.name,p.kind==='refund'?-p.amount:p.amount,(p.kind==='refund'?-1:1)*((type==='report'&&(f.block!=='all'||f.period!=='all'))?p.allocations.filter(a=>reportPeriods(e).some(q=>q.id===a.periodId)).reduce((s,a)=>s+a.amount,0):p.amount),methodNames[p.method],p.allocations.map(a=>`${periods(g).find(x=>x.id===a.periodId)?.label||'?'}: ${a.amount}`).join(' | '),p.comment,p.id])}}
else if(type==='group'){const g=findGroup(ui.groupId)||db.groups[0];if(!g)return;name=`Оплаты_${g.name}_${today()}`;const ps=periods(g);rows=[['ФИО','Телефон','Telegram','Вариант оплаты',...ps.map(p=>`${p.blockName} / ${p.label} / ${formatMonth(p.start)} оплачено`),...ps.map(p=>`${p.blockName} / ${p.label} начислено`),'Всего оплачено','Осталось оплатить','Просрочено','Следующий платёж']];for(const e of db.enrollments.filter(e=>e.groupId===g.id)){const c=enrollmentClient(e),n=nextDue(e);rows.push([c?.name,c?.phone,c?.telegram,planNames[e.plan],...ps.map(p=>paidOnPeriod(e,p)),...ps.map(p=>target(e,p)),received(e.id),outstanding(e),lateAmount(e),n?dueDate(e,n):''])}}
else if(type==='debtors'){rows=[['Клиент','Группа','Просрочено, ₽','Всего остаток, ₽','На дату','Ближайший срок','Статус участия']];for(const e of reportSelection()){const late=reportPeriods(e).reduce((s,p)=>s+(dueDate(e,p)<f.asof?Math.max(0,target(e,p)-(allocations(e.id,f.asof)[p.id]||0)):0),0);if(late<=.009)continue;const next=nextDue(e,f.asof);rows.push([enrollmentClient(e)?.name,enrollmentGroup(e)?.name,round(late),outstanding(e,f.asof),f.asof,next?dueDate(e,next):'',statusNames[e.status]])}}

function clearDemo(){if(!confirm('Удалить ВСЕ группы, клиентов и операции из текущей базы и начать с пустого журнала? Сначала скачайте резервную копию.'))return;if(!confirm('Подтвердите ещё раз: очистить все данные в этом браузере?'))return;db={version:1,groups:[],clients:[],enrollments:[],payments:[],audit:[],settings:{lastBackupAt:null,demo:false},updatedAt:nowIso(),createdAt:nowIso()};ui.groupId='';ui.modal=null;ui.page='overview';store();render();toast('Открыта пустая база. Создайте новую группу.')}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;ev.preventDefault();runClick(el,ev)});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='import-file'){importBackup(el.files?.[0]);el.value='';return}const c=el.dataset.control;if(c==='group'){ui.groupId=el.value;ui.blockId='';ui.periodId='';ui.query='';render();return}if(c==='block'){ui.blockId=el.value;ui.periodId='';render();return}if(c==='period'){ui.periodId=el.value;render();return}if(c==='paymentFilter'){ui.paymentFilter=el.value;render();return}if(c==='payEnroll'){changePayEnroll(el.value);return}if(c==='payBlock'){ui.modal.blockId=el.value;autoPaymentForm();return}if(el.dataset.enrollment==='group'){const d=ui.modal.draft;const oldCid=d.clientId;setModal({type:'enrollment',id:null,draft:createEnrollmentDraft(oldCid,el.value)});return}const r=el.dataset.report;if(r){ui.report[r]=el.value;if(r==='group'){ui.report.block='all';ui.report.period='all'}else if(r==='block'){ui.report.period='all'}render();return}if(el.classList.contains('allocation'))updatePaymentPreview();if(el.name==='pay_amount')autoPaymentForm();if(el.name?.startsWith('e_price_')){const total=updateEnrollmentTotal();const input=$('#enrollmentForm [name="e_agreedTotal"]');if(input)input.value=total}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='groupSearch'){ui.query=el.value;const g=findGroup(ui.groupId);const host=$('#group-table-host');if(g&&host)host.innerHTML=groupTable(g,groupEnrollments(g));return}if(el.id==='clientsSearch'){ui.clientQuery=el.value;const host=$('#view');if(host){const pos=el.selectionStart;host.innerHTML=viewClients();const t=$('#clientsSearch');t.focus();t.setSelectionRange(pos,pos)}return}if(el.id==='paymentsSearch'){ui.paymentQuery=el.value;const host=$('#view');if(host){const pos=el.selectionStart;host.innerHTML=viewPayments();const t=$('#paymentsSearch');t.focus();t.setSelectionRange(pos,pos)}return}if(el.name==='pay_amount'){autoPaymentForm();return}if(el.classList.contains('allocation')){updatePaymentPreview();return}if(el.name?.startsWith('e_price_')){const total=updateEnrollmentTotal();const inp=$('#enrollmentForm [name="e_agreedTotal"]');if(inp)inp.value=total}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.modal){closeModal()}});
window.addEventListener('storage',ev=>{if(ev.key===STORAGE_KEY&&ev.newValue){try{db=JSON.parse(ev.newValue);render();toast('Данные обновлены из другой вкладки браузера.')}catch(e){}}});
